<svg
      xmlns="http://www.w3.org/2000/svg"
      version="1.1"
      viewBox="0 0 700 700"
      width="700"
      height="700"
      opacity="0.6"
    >
      <defs>
        <filter
          id="nnnoise-filter"
          x="-20%"
          y="-20%"
          width="140%"
          height="140%"
          filterUnits="objectBoundingBox"
          primitiveUnits="userSpaceOnUse"
          colorInterpolationFilters="linearRGB"
        >
          <feTurbulence
            type="turbulence"
            baseFrequency="0.17"
            numOctaves="4"
            seed="15"
            stitchTiles="stitch"
            x="0%"
            y="0%"
            width="100%"
            height="100%"
            result="turbulence"
          />
          <feSpecularLighting
            surfaceScale="26"
            specularConstant="1.8"
            specularExponent="20"
            lightingColor="#4f364b"
            x="0%"
            y="0%"
            width="100%"
            height="100%"
            in="turbulence"
            result="specularLighting"
          >
            <feDistantLight azimuth="3" elevation="1" />
          </feSpecularLighting>
        </filter>
      </defs>
      <rect width="700" height="700" fill="transparent" />
      <rect
        width="700"
        height="700"
        fill="#4f364b"
        filter="url(#nnnoise-filter)"
      />
    </svg>
