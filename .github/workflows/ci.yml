name: CI
on:
  push:
    branches:
      - '*' # Run on all branches
  pull_request:
    branches:
      - main
  workflow_dispatch: # Enable manual triggering
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm run test || echo "No tests defined"
